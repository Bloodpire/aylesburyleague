<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aylesbury League</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 30px auto;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-title h1 {
            font-size: 2rem;
            color: var(--accent-yellow);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .admin-badge {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid var(--accent-green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            max-width: 1100px;
            margin: 0 auto 25px auto;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            letter-spacing: 0.5px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background-color: var(--accent-yellow);
            color: #0d1117;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Action Bar */
        .action-bar {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .btn-add {
            background-color: var(--accent-yellow);
            color: #0d1117;
            border: none;
            padding: 10px 22px;
            font-weight: 800;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Dark Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        th, td {
            padding: 16px 20px;
            text-align: center;
        }

        th {
            background-color: rgba(0, 0, 0, 0.4);
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            border-bottom: 1px solid rgba(48, 54, 61, 0.5);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .team-name-cell {
            text-align: left;
            font-weight: 700;
            color: #ffffff;
        }

        /* Player Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .fifa-card {
            background: linear-gradient(145deg, #1f2937, #111827);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px 15px;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            text-align: center;
        }

        .fifa-card img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-yellow);
            margin: 10px 0;
            background-color: var(--bg-dark);
        }

        .fifa-card .player-rating {
            font-size: 1.8rem;
            font-weight: 900;
            position: absolute;
            top: 15px;
            left: 18px;
            color: var(--accent-yellow);
        }

        .fifa-card .player-pos {
            font-size: 0.85rem;
            position: absolute;
            top: 48px;
            left: 18px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .fifa-card h3 {
            margin: 8px 0 0 0;
            font-size: 1.1rem;
            color: #ffffff;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 14px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--accent-yellow);
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .form-group input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: #ffffff;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-yellow);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-cancel {
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save {
            background-color: var(--accent-green);
            color: #0d1117;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <span style="font-size: 2.2rem;">⚽</span>
            <h1>Aylesbury League</h1>
        </div>
        <div class="admin-badge">⚡ Admin Active</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('cards')">CARDS</button>
        <button class="tab-btn" onclick="switchTab('calendar')">CALENDAR</button>
        <button class="tab-btn" onclick="switchTab('league')">LEAGUE TABLE</button>
    </div>

    <div class="container">
        <!-- CARDS TAB -->
        <div id="cards-tab" class="tab-content active">
            <div class="action-bar">
                <button class="btn-add" onclick="openModal('player-modal')">+ ADD PLAYER</button>
            </div>
            <div id="cards-grid" class="cards-grid">
                <!-- Player cards render here -->
            </div>
        </div>

        <!-- CALENDAR TAB -->
        <div id="calendar-tab" class="tab-content">
            <div class="action-bar">
                <button class="btn-add" onclick="openModal('match-modal')">+ ADD MATCH</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>DATE</th>
                        <th>TIME</th>
                        <th>HOME</th>
                        <th>AWAY</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="matches-table-body">
                    <!-- Matches render here -->
                </tbody>
            </table>
        </div>

        <!-- LEAGUE TAB -->
        <div id="league-tab" class="tab-content">
            <div class="action-bar">
                <button class="btn-add" onclick="openModal('team-modal')">+ ADD TEAM</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>POS</th>
                        <th style="text-align: left;">TEAM</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GF</th>
                        <th>GA</th>
                        <th>GD</th>
                        <th>PTS</th>
                    </tr>
                </thead>
                <tbody id="league-table-body">
                    <!-- Teams render here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ADD TEAM MODAL -->
    <div id="team-modal" class="modal">
        <div class="modal-content">
            <h2>Add New Team</h2>
            <div class="form-group">
                <label>Team Name</label>
                <input type="text" id="team-name" placeholder="e.g. Aylesbury FC">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('team-modal')">Cancel</button>
                <button class="btn-save" onclick="saveTeam()">Save Team</button>
            </div>
        </div>
    </div>

    <!-- ADD MATCH MODAL -->
    <div id="match-modal" class="modal">
        <div class="modal-content">
            <h2>Schedule Match</h2>
            <div class="form-group">
                <label>Home Team</label>
                <input type="text" id="match-home" placeholder="Home Team Name">
            </div>
            <div class="form-group">
                <label>Away Team</label>
                <input type="text" id="match-away" placeholder="Away Team Name">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="match-date">
            </div>
            <div class="form-group">
                <label>Time</label>
                <input type="time" id="match-time">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('match-modal')">Cancel</button>
                <button class="btn-save" onclick="saveMatch()">Save Match</button>
            </div>
        </div>
    </div>

    <!-- ADD PLAYER MODAL -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <h2>Add Player Card</h2>
            <div class="form-group">
                <label>Player Name</label>
                <input type="text" id="player-name" placeholder="e.g. John Smith">
            </div>
            <div class="form-group">
                <label>Position</label>
                <input type="text" id="player-pos" placeholder="ST, CM, CB, GK">
            </div>
            <div class="form-group">
                <label>Rating (1-99)</label>
                <input type="number" id="player-rating" value="80">
            </div>
            <div class="form-group">
                <label>Image URL (Optional)</label>
                <input type="text" id="player-img-url" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('player-modal')">Cancel</button>
                <button class="btn-save" onclick="savePlayer()">Save Player</button>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE SETUP
        const SUPABASE_URL = 'https://bmwiqpkgdbeohkwbqaft.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_kguMGdM9yIP_qoUdOU6x_w_4ObYO4Wt';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // TAB SWITCHER
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'cards') {
                document.getElementById('cards-tab').classList.add('active');
                event.target.classList.add('active');
                fetchPlayers();
            } else if (tabName === 'calendar') {
                document.getElementById('calendar-tab').classList.add('active');
                event.target.classList.add('active');
                fetchMatches();
            } else if (tabName === 'league') {
                document.getElementById('league-tab').classList.add('active');
                event.target.classList.add('active');
                fetchTeams();
            }
        }

        // MODAL TOGGLES
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- PLAYERS DATA ---
        async function fetchPlayers() {
            let { data, error } = await db.from('players').select('*');
            if (error) {
                const fallback = await db.from('players_records').select('*');
                data = fallback.data;
            }

            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(p => {
                    const imgSrc = p.img_url || 'https://via.placeholder.com/105';
                    grid.innerHTML += `
                        <div class="fifa-card">
                            <div class="player-rating">${p.rating || 80}</div>
                            <div class="player-pos">${p.position || 'CM'}</div>
                            <img src="${imgSrc}" alt="${p.name}">
                            <h3>${p.name}</h3>
                        </div>
                    `;
                });
            }
        }

        async function savePlayer() {
            const name = document.getElementById('player-name').value;
            const pos = document.getElementById('player-pos').value;
            const rating = parseInt(document.getElementById('player-rating').value);
            const imgUrl = document.getElementById('player-img-url').value;

            if (!name) return alert('Enter player name!');

            const payload = [{
                name: name,
                position: pos,
                rating: rating,
                img_url: imgUrl
            }];

            let { error } = await db.from('players').insert(payload);
            if (error) {
                await db.from('players_records').insert(payload);
            }

            closeModal('player-modal');
            document.getElementById('player-name').value = '';
            document.getElementById('player-pos').value = '';
            document.getElementById('player-img-url').value = '';
            fetchPlayers();
        }

        // --- TEAMS DATA ---
        async function fetchTeams() {
            const { data, error } = await db.from('teams').select('*').order('pts', { ascending: false });
            if (error) return console.error(error);

            const tbody = document.getElementById('league-table-body');
            tbody.innerHTML = '';
            data.forEach((team, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="team-name-cell">${team.name}</td>
                        <td>${team.played}</td>
                        <td>${team.wins}</td>
                        <td>${team.draws}</td>
                        <td>${team.losses}</td>
                        <td>${team.goals_for}</td>
                        <td>${team.goals_against}</td>
                        <td>${team.gd}</td>
                        <td><strong>${team.pts}</strong></td>
                    </tr>
                `;
            });
        }

        async function saveTeam() {
            const name = document.getElementById('team-name').value;
            if (!name) return alert('Please enter a team name!');

            const { error } = await db.from('teams').insert([{
                name: name,
                played: 0,
                wins: 0,
                draws: 0,
                losses: 0,
                goals_for: 0,
                goals_against: 0,
                pts: 0
            }]);

            if (error) {
                alert(error.message);
            } else {
                closeModal('team-modal');
                document.getElementById('team-name').value = '';
                fetchTeams();
            }
        }

        // --- MATCHES DATA ---
        async function fetchMatches() {
            const { data, error } = await db.from('matches').select('*').order('match_date', { ascending: true });
            if (error) return console.error(error);

            const tbody = document.getElementById('matches-table-body');
            tbody.innerHTML = '';
            data.forEach(match => {
                tbody.innerHTML += `
                    <tr>
                        <td>${match.match_date || 'TBD'}</td>
                        <td>${match.match_time || 'TBD'}</td>
                        <td class="team-name-cell">${match.home_team}</td>
                        <td class="team-name-cell">${match.away_team}</td>
                        <td>${match.status || 'Upcoming'}</td>
                    </tr>
                `;
            });
        }

        async function saveMatch() {
            const home = document.getElementById('match-home').value;
            const away = document.getElementById('match-away').value;
            const date = document.getElementById('match-date').value;
            const time = document.getElementById('match-time').value;

            if (!home || !away) return alert('Enter both teams!');

            const { error } = await db.from('matches').insert([{
                home_team: home,
                away_team: away,
                match_date: date,
                match_time: time,
                status: 'Upcoming'
            }]);

            if (error) {
                alert(error.message);
            } else {
                closeModal('match-modal');
                fetchMatches();
            }
        }

        // Initial fetch
        fetchPlayers();
    </script>
</body>
</html>
