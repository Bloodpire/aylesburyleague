<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aylesbury League</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 30px auto;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-title h1 {
            font-size: 2rem;
            color: var(--accent-yellow);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-badge {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid var(--accent-green);
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--accent-yellow);
            color: #000;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .action-bar {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .btn-add {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-add:hover {
            transform: scale(1.03);
        }

        /* League Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 14px 18px;
            text-align: center;
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .team-name-cell {
            text-align: left;
            font-weight: bold;
        }

        /* Player Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .fifa-card {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 12px;
            padding: 15px;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            position: relative;
            text-align: center;
        }

        .fifa-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            margin-bottom: 10px;
        }

        .fifa-card .player-rating {
            font-size: 1.8rem;
            font-weight: 900;
            position: absolute;
            top: 15px;
            left: 15px;
        }

        .fifa-card .player-pos {
            font-size: 0.9rem;
            position: absolute;
            top: 45px;
            left: 15px;
            font-weight: bold;
            color: #cbd5e1;
        }

        .fifa-card h3 {
            margin: 5px 0;
            font-size: 1.2rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--accent-yellow);
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background-color: #475569;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-save {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <span style="font-size: 2rem;">⚽</span>
            <h1>Aylesbury League</h1>
        </div>
        <div class="admin-badge">⚡ Admin Active</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn" onclick="switchTab('cards')">CARDS</button>
        <button class="tab-btn" onclick="switchTab('calendar')">CALENDAR</button>
        <button class="tab-btn active" onclick="switchTab('league')">LEAGUE TABLE</button>
    </div>

    <div class="container">
        <!-- LEAGUE TABLE TAB -->
        <div id="league-tab" class="tab-content active">
            <div class="action-bar">
                <button class="btn-add" onclick="openModal('team-modal')">+ ADD TEAM</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>POS</th>
                        <th style="text-align: left;">TEAM</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GF</th>
                        <th>GA</th>
                        <th>GD</th>
                        <th>PTS</th>
                    </tr>
                </thead>
                <tbody id="league-table-body">
                    <!-- Teams render here -->
                </tbody>
            </table>
        </div>

        <!-- CALENDAR TAB -->
        <div id="calendar-tab" class="tab-content">
            <div class="action-bar">
                <button class="btn-add" onclick="openModal('match-modal')">+ ADD MATCH</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>DATE</th>
                        <th>TIME</th>
                        <th>HOME</th>
                        <th>AWAY</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="matches-table-body">
                    <!-- Matches render here -->
                </tbody>
            </table>
        </div>

        <!-- CARDS TAB -->
        <div id="cards-tab" class="tab-content">
            <div class="action-bar">
                <button class="btn-add" onclick="openModal('player-modal')">+ ADD PLAYER</button>
            </div>
            <div id="cards-grid" class="cards-grid">
                <!-- Player cards render here -->
            </div>
        </div>
    </div>

    <!-- ADD TEAM MODAL -->
    <div id="team-modal" class="modal">
        <div class="modal-content">
            <h2>Add New Team</h2>
            <div class="form-group">
                <label>Team Name</label>
                <input type="text" id="team-name" placeholder="e.g. Aylesbury FC">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('team-modal')">Cancel</button>
                <button class="btn-save" onclick="saveTeam()">Save Team</button>
            </div>
        </div>
    </div>

    <!-- ADD MATCH MODAL -->
    <div id="match-modal" class="modal">
        <div class="modal-content">
            <h2>Schedule Match</h2>
            <div class="form-group">
                <label>Home Team</label>
                <input type="text" id="match-home" placeholder="Home Team Name">
            </div>
            <div class="form-group">
                <label>Away Team</label>
                <input type="text" id="match-away" placeholder="Away Team Name">
            </div>
            <div class="form-group">
                <label>Match Date</label>
                <input type="date" id="match-date">
            </div>
            <div class="form-group">
                <label>Match Time</label>
                <input type="time" id="match-time">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('match-modal')">Cancel</button>
                <button class="btn-save" onclick="saveMatch()">Save Match</button>
            </div>
        </div>
    </div>

    <!-- ADD PLAYER MODAL -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <h2>Add Player Card</h2>
            <div class="form-group">
                <label>Player Name</label>
                <input type="text" id="player-name" placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label>Position</label>
                <input type="text" id="player-pos" placeholder="ST, CM, CB, GK">
            </div>
            <div class="form-group">
                <label>Rating (1-99)</label>
                <input type="number" id="player-rating" value="80">
            </div>
            <div class="form-group">
                <label>Upload Image File (Supabase Storage)</label>
                <input type="file" id="player-img-file" accept="image/*">
            </div>
            <div class="form-group">
                <label>OR Image URL</label>
                <input type="text" id="player-img-url" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('player-modal')">Cancel</button>
                <button class="btn-save" onclick="savePlayer()">Save Player</button>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE INIT - Replace with your project details
        const SUPABASE_URL = 'https://bmwiqpkgdbohkwbqaft.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // TAB SWITCHING LOGIC
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'league') {
                document.getElementById('league-tab').classList.add('active');
                event.target.classList.add('active');
                fetchTeams();
            } else if (tabName === 'calendar') {
                document.getElementById('calendar-tab').classList.add('active');
                event.target.classList.add('active');
                fetchMatches();
            } else if (tabName === 'cards') {
                document.getElementById('cards-tab').classList.add('active');
                event.target.classList.add('active');
                fetchPlayers();
            }
        }

        // MODAL HELPERS
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- TEAMS LOGIC ---
        async function fetchTeams() {
            const { data, error } = await db.from('teams').select('*').order('pts', { ascending: false });
            if (error) return console.error(error);

            const tbody = document.getElementById('league-table-body');
            tbody.innerHTML = '';
            data.forEach((team, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="team-name-cell">${team.name}</td>
                        <td>${team.played}</td>
                        <td>${team.wins}</td>
                        <td>${team.draws}</td>
                        <td>${team.losses}</td>
                        <td>${team.goals_for}</td>
                        <td>${team.goals_against}</td>
                        <td>${team.gd}</td>
                        <td><strong>${team.pts}</strong></td>
                    </tr>
                `;
            });
        }

        async function saveTeam() {
            const name = document.getElementById('team-name').value;
            if (!name) return alert('Enter a team name!');

            // gd is EXCLUDED so Supabase calculates it automatically!
            const { error } = await db.from('teams').insert([{
                name: name,
                played: 0,
                wins: 0,
                draws: 0,
                losses: 0,
                goals_for: 0,
                goals_against: 0,
                pts: 0
            }]);

            if (error) {
                alert(error.message);
            } else {
                closeModal('team-modal');
                document.getElementById('team-name').value = '';
                fetchTeams();
            }
        }

        // --- MATCHES LOGIC ---
        async function fetchMatches() {
            const { data, error } = await db.from('matches').select('*').order('match_date', { ascending: true });
            if (error) return console.error(error);

            const tbody = document.getElementById('matches-table-body');
            tbody.innerHTML = '';
            data.forEach(match => {
                tbody.innerHTML += `
                    <tr>
                        <td>${match.match_date || 'TBD'}</td>
                        <td>${match.match_time || 'TBD'}</td>
                        <td>${match.home_team}</td>
                        <td>${match.away_team}</td>
                        <td>${match.status || 'Upcoming'}</td>
                    </tr>
                `;
            });
        }

        async function saveMatch() {
            const home = document.getElementById('match-home').value;
            const away = document.getElementById('match-away').value;
            const date = document.getElementById('match-date').value;
            const time = document.getElementById('match-time').value;

            if (!home || !away) return alert('Please enter both teams!');

            const { error } = await db.from('matches').insert([{
                home_team: home,
                away_team: away,
                match_date: date,
                match_time: time,
                status: 'Upcoming'
            }]);

            if (error) {
                alert(error.message);
            } else {
                closeModal('match-modal');
                fetchMatches();
            }
        }

        // --- PLAYERS / CARDS LOGIC ---
        async function fetchPlayers() {
            const { data, error } = await db.from('players').select('*');
            if (error) return console.error(error);

            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';
            data.forEach(p => {
                const img = p.img_url || 'https://via.placeholder.com/100';
                grid.innerHTML += `
                    <div class="fifa-card">
                        <div class="player-rating">${p.rating || 80}</div>
                        <div class="player-pos">${p.position || 'CM'}</div>
                        <img src="${img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                    </div>
                `;
            });
        }

        async function savePlayer() {
            const name = document.getElementById('player-name').value;
            const pos = document.getElementById('player-pos').value;
            const rating = parseInt(document.getElementById('player-rating').value);
            const fileInput = document.getElementById('player-img-file');
            let imgUrl = document.getElementById('player-img-url').value;

            if (!name) return alert('Enter player name!');

            // Supabase Storage handling if file was chosen
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileName = `${Date.now()}_${file.name}`;
                const { data: uploadData, error: uploadErr } = await db.storage
                    .from('player-photos')
                    .upload(fileName, file);

                if (!uploadErr) {
                    const { data: urlData } = db.storage
                        .from('player-photos')
                        .getPublicUrl(fileName);
                    imgUrl = urlData.publicUrl;
                }
            }

            const { error } = await db.from('players').insert([{
                name: name,
                position: pos,
                rating: rating,
                img_url: imgUrl
            }]);

            if (error) {
                alert(error.message);
            } else {
                closeModal('player-modal');
                fetchPlayers();
            }
        }

        // Initial Load
        fetchTeams();
    </script>
</body>
</html>
