<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aylesbury League</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --sky-blue: #00BFFF;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #11141a;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: #f1c40f; text-shadow: 0 4px 15px rgba(241, 196, 15, 0.3); font-size: 3rem; margin-bottom: 20px; font-weight: 900;}

        /* Controls Section (Add Button + Filters) */
        .controls-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            background: #1e2430;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .open-modal-btn {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3);
            transition: 0.2s;
        }

        .open-modal-btn:hover { transform: translateY(-2px); }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label { font-size: 0.85rem; font-weight: 700; color: #aaa; text-transform: uppercase; }

        /* EA FC Authentic Card Base */
        .fc-card {
            position: relative;
            width: 230px;
            height: 350px;
            clip-path: polygon(18% 0%, 82% 0%, 100% 9%, 100% 82%, 50% 100%, 0% 82%, 0% 9%);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            user-select: none;
            overflow: hidden;
        }

        .fc-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 35px rgba(241, 196, 15, 0.3);
        }

        .fc-card-inner {
            position: absolute;
            inset: 3px;
            clip-path: polygon(18% 0%, 82% 0%, 100% 9%, 100% 82%, 50% 100%, 0% 82%, 0% 9%);
            padding: 15px 12px;
            box-sizing: border-box;
        }

        /* --- Dynamic Card Tiers --- */
        /* Gold Tier */
        .fc-card.gold { background: linear-gradient(135deg, #f3e098 0%, #d4af37 50%, #aa7c11 100%); }
        .fc-card.gold .fc-card-inner { background: radial-gradient(circle at 50% 35%, #fff2a8 0%, #dfb547 60%, #8c6200 100%); color: #2b1f00; }

        /* Silver Tier */
        .fc-card.silver { background: linear-gradient(135deg, #e0e0e0 0%, #a6a6a6 50%, #595959 100%); }
        .fc-card.silver .fc-card-inner { background: radial-gradient(circle at 50% 35%, #ffffff 0%, #c0c0c0 60%, #4a4a4a 100%); color: #1a1a1a; }

        /* Bronze Tier */
        .fc-card.bronze { background: linear-gradient(135deg, #d39869 0%, #a05a2c 50%, #5c3214 100%); }
        .fc-card.bronze .fc-card-inner { background: radial-gradient(circle at 50% 35%, #f2be9b 0%, #b86d3b 60%, #4a240c 100%); color: #260d02; }

        /* Card Elements */
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            z-index: 10;
        }

        .card-top-left {
            position: absolute;
            top: 25px;
            left: 20px;
            text-align: center;
            line-height: 0.9;
            z-index: 2;
        }

        .card-ovr { font-size: 2.3rem; font-weight: 900; letter-spacing: -1px; }
        .card-pos { font-size: 1.1rem; font-weight: 800; margin-top: 2px; }

        .card-player-img {
            position: absolute;
            top: 20px;
            right: 15px;
            width: 140px;
            height: 140px;
            object-fit: cover;
            z-index: 1;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
        }

        .card-name {
            position: absolute;
            top: 180px;
            width: 100%;
            left: 0;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            border-top: 1px solid rgba(0,0,0,0.15);
            padding-top: 4px;
        }

        .card-stats {
            position: absolute;
            top: 215px;
            left: 10px;
            right: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            text-align: center;
            font-size: 0.65rem;
            font-weight: 800;
        }

        .stat-val { font-size: 0.9rem; font-weight: 900; display: block; }

        .card-badges {
            position: absolute;
            bottom: 30px;
            width: 100%;
            left: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            font-weight: 800;
        }

        #leaderboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 35px;
            justify-items: center;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #1e2430;
            color: #fff;
            margin: 4% auto;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header { font-size: 1.6rem; font-weight: 800; margin-bottom: 20px; text-align: center; color: #f1c40f; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-width { grid-column: span 2; }

        input, select {
            padding: 10px 12px;
            background: #11141a;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            box-sizing: border-box;
        }

        .save-btn {
            grid-column: span 2;
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 1.8rem; cursor: pointer; color: #aaa; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1.05rem;
        }

        .playstyle-badge {
            background: #f1c40f;
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            display: inline-block;
            margin: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ AYLESBURY LEAGUE</h1>

    <!-- Filter & Add Bar -->
    <div class="controls-section">
        <button class="open-modal-btn" onclick="openEditModal()">+ Add New Player</button>
        
        <div class="filter-group">
            <label>Filter Position:</label>
            <select id="posFilter" onchange="applyFilters()">
                <option value="ALL">All Positions</option>
                <option value="ATT">Attackers (ST, CF, RW, LW)</option>
                <option value="MID">Midfielders (CM, CAM, CDM)</option>
                <option value="DEF">Defenders (CB, LB, RB)</option>
            </select>

            <label>Sort By:</label>
            <select id="sortBy" onchange="applyFilters()">
                <option value="ovr">Overall Rating</option>
                <option value="goals">Most Goals</option>
                <option value="assists">Most Assists</option>
            </select>
        </div>
    </div>

    <div id="leaderboard"></div>
</div>

<!-- Player Details Modal -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeDetailModal()">&times;</span>
        <div class="modal-header" id="detailName">Player Details</div>
        <div id="detailBody"></div>
        <button class="save-btn" id="editFromDetailBtn" style="margin-top:20px;">Edit Player Stats</button>
    </div>
</div>

<!-- Add/Edit Player Modal -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-header" id="modalTitle">Add Player</div>
        
        <div class="form-grid">
            <input type="hidden" id="edit-id">
            <input type="text" id="name" placeholder="Full Name" class="full-width">
            <input type="text" id="img-url" placeholder="Transparent Cutout Photo URL" class="full-width">
            <input type="text" id="pos" placeholder="POS (ST, CM, CB)">
            <select id="wf">
                <option value="⭐">1★ Weak Foot</option>
                <option value="⭐⭐">2★ Weak Foot</option>
                <option value="⭐⭐⭐">3★ Weak Foot</option>
                <option value="⭐⭐⭐⭐" selected>4★ Weak Foot</option>
                <option value="⭐⭐⭐⭐⭐">5★ Weak Foot</option>
            </select>
            <select id="sm">
                <option value="1">1★ Skill Moves</option>
                <option value="2">2★ Skill Moves</option>
                <option value="3">3★ Skill Moves</option>
                <option value="4" selected>4★ Skill Moves</option>
                <option value="5">5★ Skill Moves</option>
            </select>
            <input type="number" id="pac" placeholder="PAC" max="99">
            <input type="number" id="sho" placeholder="SHO" max="99">
            <input type="number" id="pas" placeholder="PAS" max="99">
            <input type="number" id="dri" placeholder="DRI" max="99">
            <input type="number" id="def" placeholder="DEF" max="99">
            <input type="number" id="phy" placeholder="PHY" max="99">
            
            <input type="number" id="goals" placeholder="Goals Scored">
            <input type="number" id="assists" placeholder="Assists">

            <input type="text" id="playstyles" placeholder="PlayStyles (e.g. Finesse Shot, Power Header)" class="full-width">

            <button class="save-btn" onclick="savePlayer()" id="saveBtnText">Save Player Data</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://bmwiqpkgdbeohkwbqaft.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let rawPlayers = [];
    let displayedPlayers = [];
    const modal = document.getElementById('playerModal');
    const detailModal = document.getElementById('detailModal');

    async function fetchPlayers() {
        const { data, error } = await supabase
            .from('players')
            .select('*');

        if (error) { console.error('Error fetching players:', error); return; }
        rawPlayers = data || [];
        applyFilters();
    }

    function applyFilters() {
        const posFilter = document.getElementById('posFilter').value;
        const sortBy = document.getElementById('sortBy').value;

        // Position Filter Logic
        displayedPlayers = rawPlayers.filter(p => {
            const pos = (p.pos || '').toUpperCase();
            if (posFilter === 'ATT') return ['ST', 'CF', 'RW', 'LW', 'RF', 'LF'].includes(pos);
            if (posFilter === 'MID') return ['CM', 'CAM', 'CDM', 'RM', 'LM'].includes(pos);
            if (posFilter === 'DEF') return ['CB', 'LB', 'RB', 'LWB', 'RWB', 'GK'].includes(pos);
            return true;
        });

        // Sorting Logic
        displayedPlayers.sort((a, b) => (b[sortBy] || 0) - (a[sortBy] || 0));

        renderLeaderboard();
    }

    function openDetailModal(p) {
        document.getElementById('detailName').innerText = p.name;
        
        const playstyleTags = (p.playstyles || 'None')
            .split(',')
            .map(ps => `<span class="playstyle-badge">${ps.trim()}</span>`)
            .join('');

        document.getElementById('detailBody').innerHTML = `
            <div class="detail-row"><span>Position</span><strong>${p.pos}</strong></div>
            <div class="detail-row"><span>Overall Rating</span><strong>${p.ovr} OVR</strong></div>
            <div class="detail-row"><span>Goals Scored</span><strong>⚽ ${p.goals || 0}</strong></div>
            <div class="detail-row"><span>Assists</span><strong>🅰️ ${p.assists || 0}</strong></div>
            <div class="detail-row"><span>Weak Foot</span><strong>${p.wf}</strong></div>
            <div class="detail-row"><span>Skill Moves</span><strong>${'⭐'.repeat(p.sm || 4)}</strong></div>
            <div style="margin-top:15px;">
                <div style="margin-bottom:8px; font-weight:700;">PlayStyles:</div>
                <div>${playstyleTags}</div>
            </div>
        `;

        document.getElementById('editFromDetailBtn').onclick = () => {
            closeDetailModal();
            openEditModal(p.id);
        };

        detailModal.style.display = "block";
    }

    function closeDetailModal() { detailModal.style.display = "none"; }

    function openEditModal(playerId = null) {
        resetForm();
        if (playerId !== null) {
            const p = rawPlayers.find(x => String(x.id) === String(playerId));
            if (!p) return;
            document.getElementById('modalTitle').innerText = `Edit ${p.name}`;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('name').value = p.name;
            document.getElementById('img-url').value = p.img.includes('flaticon') ? '' : p.img;
            document.getElementById('pos').value = p.pos;
            document.getElementById('wf').value = p.wf;
            document.getElementById('sm').value = p.sm || 4;
            document.getElementById('pac').value = p.pac;
            document.getElementById('sho').value = p.sho;
            document.getElementById('pas').value = p.pas;
            document.getElementById('dri').value = p.dri;
            document.getElementById('def').value = p.def;
            document.getElementById('phy').value = p.phy;
            document.getElementById('goals').value = p.goals || 0;
            document.getElementById('assists').value = p.assists || 0;
            document.getElementById('playstyles').value = p.playstyles || '';
            document.getElementById('saveBtnText').innerText = "Update Player Info";
        }
        modal.style.display = "block";
    }

    function closeModal() { modal.style.display = "none"; }

    async function savePlayer() {
        const idInput = document.getElementById('edit-id').value;
        const stats = [
            parseInt(document.getElementById('pac').value) || 0,
            parseInt(document.getElementById('sho').value) || 0,
            parseInt(document.getElementById('pas').value) || 0,
            parseInt(document.getElementById('dri').value) || 0,
            parseInt(document.getElementById('def').value) || 0,
            parseInt(document.getElementById('phy').value) || 0
        ];
        const ovr = Math.round(stats.reduce((a, b) => a + b) / 6);
        
        const playerData = {
            name: document.getElementById('name').value || "Player",
            img: document.getElementById('img-url').value || "https://cdn-icons-png.flaticon.com/512/1163/1163481.png",
            pos: (document.getElementById('pos').value || "ST").toUpperCase(),
            wf: document.getElementById('wf').value,
            sm: parseInt(document.getElementById('sm').value) || 4,
            pac: stats[0], sho: stats[1], pas: stats[2],
            dri: stats[3], def: stats[4], phy: stats[5],
            goals: parseInt(document.getElementById('goals').value) || 0,
            assists: parseInt(document.getElementById('assists').value) || 0,
            playstyles: document.getElementById('playstyles').value || 'Technical',
            ovr: ovr
        };

        if (idInput) {
            await supabase.from('players').update(playerData).eq('id', idInput);
        } else {
            await supabase.from('players').insert([playerData]);
        }

        closeModal();
        fetchPlayers();
    }

    async function deletePlayer(playerId) {
        if (confirm("Permanently delete this player?")) {
            await supabase.from('players').delete().eq('id', playerId);
            fetchPlayers();
        }
    }

    function renderLeaderboard() {
        const container = document.getElementById('leaderboard');
        container.innerHTML = '';

        displayedPlayers.forEach((p) => {
            // Determine tier
            let tierClass = 'gold';
            if (p.ovr < 65) tierClass = 'bronze';
            else if (p.ovr < 75) tierClass = 'silver';

            const card = document.createElement('div');
            card.className = `fc-card ${tierClass}`;
            
            card.innerHTML = `
                <div class="fc-card-inner">
                    <button class="delete-btn" onclick="event.stopPropagation(); deletePlayer('${p.id}')">X</button>
                    
                    <div class="card-top-left">
                        <div class="card-ovr">${p.ovr}</div>
                        <div class="card-pos">${p.pos}</div>
                    </div>

                    <img src="${p.img}" class="card-player-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1163/1163481.png'">

                    <div class="card-name">${p.name}</div>

                    <div class="card-stats">
                        <div>PAC<span class="stat-val">${p.pac}</span></div>
                        <div>SHO<span class="stat-val">${p.sho}</span></div>
                        <div>PAS<span class="stat-val">${p.pas}</span></div>
                        <div>DRI<span class="stat-val">${p.dri}</span></div>
                        <div>DEF<span class="stat-val">${p.def}</span></div>
                        <div>PHY<span class="stat-val">${p.phy}</span></div>
                    </div>

                    <div class="card-badges">
                        <span>⚽ ${p.goals || 0}</span>
                        <span>🅰️ ${p.assists || 0}</span>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => openDetailModal(p));
            container.appendChild(card);
        });
    }

    function resetForm() {
        document.getElementById('edit-id').value = '';
        document.getElementById('name').value = '';
        document.getElementById('img-url').value = '';
        document.getElementById('pos').value = '';
        document.getElementById('pac').value = '';
        document.getElementById('sho').value = '';
        document.getElementById('pas').value = '';
        document.getElementById('dri').value = '';
        document.getElementById('def').value = '';
        document.getElementById('phy').value = '';
        document.getElementById('goals').value = '';
        document.getElementById('assists').value = '';
        document.getElementById('playstyles').value = '';
        document.getElementById('wf').value = '⭐⭐⭐⭐';
        document.getElementById('sm').value = '4';
        document.getElementById('modalTitle').innerText = 'Add New Player';
        document.getElementById('saveBtnText').innerText = 'Add to League';
    }

    window.onclick = function(e) {
        if (e.target == modal) closeModal();
        if (e.target == detailModal) closeDetailModal();
    }

    fetchPlayers();
</script>
</body>
</html>
