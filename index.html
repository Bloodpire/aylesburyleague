<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aylesbury League</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --sky-blue: #00BFFF;
            --gold: #f1c40f;
            --bg-dark: #11141a;
            --card-bg: #1e2430;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: auto; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { 
            color: var(--gold); 
            text-shadow: 0 4px 15px rgba(241, 196, 15, 0.3); 
            font-size: 2.5rem; 
            margin: 0; 
            font-weight: 900;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            color: #aaa;
            border: none;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: #000; background: var(--gold); box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .admin-login-btn {
            background: #2c3e50;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-login-btn:hover { background: #34495e; }

        .admin-badge {
            background: #27ae60;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            display: none;
        }

        /* Controls Section */
        .controls-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .open-modal-btn {
            background: linear-gradient(135deg, #f39c12, var(--gold));
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3);
            transition: 0.2s;
            display: none; /* Hidden until admin logs in */
        }

        .open-modal-btn:hover { transform: translateY(-2px); }

        .filter-group { display: flex; gap: 10px; align-items: center; }
        .filter-group label { font-size: 0.85rem; font-weight: 700; color: #aaa; text-transform: uppercase; }

        /* EA FC Card Base */
        .fc-card {
            position: relative;
            width: 230px;
            height: 350px;
            clip-path: polygon(18% 0%, 82% 0%, 100% 9%, 100% 82%, 50% 100%, 0% 82%, 0% 9%);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            user-select: none;
            overflow: hidden;
        }

        .fc-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 35px rgba(241, 196, 15, 0.3);
        }

        .fc-card-inner {
            position: absolute;
            inset: 3px;
            clip-path: polygon(18% 0%, 82% 0%, 100% 9%, 100% 82%, 50% 100%, 0% 82%, 0% 9%);
            padding: 15px 12px;
            box-sizing: border-box;
        }

        .fc-card.gold { background: linear-gradient(135deg, #f3e098 0%, #d4af37 50%, #aa7c11 100%); }
        .fc-card.gold .fc-card-inner { background: radial-gradient(circle at 50% 35%, #fff2a8 0%, #dfb547 60%, #8c6200 100%); color: #2b1f00; }

        .fc-card.silver { background: linear-gradient(135deg, #e0e0e0 0%, #a6a6a6 50%, #595959 100%); }
        .fc-card.silver .fc-card-inner { background: radial-gradient(circle at 50% 35%, #ffffff 0%, #c0c0c0 60%, #4a4a4a 100%); color: #1a1a1a; }

        .fc-card.bronze { background: linear-gradient(135deg, #d39869 0%, #a05a2c 50%, #5c3214 100%); }
        .fc-card.bronze .fc-card-inner { background: radial-gradient(circle at 50% 35%, #f2be9b 0%, #b86d3b 60%, #4a240c 100%); color: #260d02; }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            z-index: 10;
            display: none;
        }

        .card-top-left {
            position: absolute;
            top: 25px;
            left: 12px;
            width: 75px;
            text-align: center;
            line-height: 1;
            z-index: 3;
        }

        .card-ovr { font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; }
        .card-pos { font-weight: 800; margin-top: 4px; word-break: break-word; line-height: 1.1; }

        .card-player-img {
            position: absolute;
            top: 35px;
            right: 12px;
            width: 130px;
            height: 130px;
            object-fit: cover;
            z-index: 1;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
        }

        .card-name {
            position: absolute;
            top: 182px;
            width: 100%;
            left: 0;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 900;
            text-transform: uppercase;
            border-top: 1px solid rgba(0,0,0,0.15);
            padding-top: 6px;
            letter-spacing: 0.5px;
        }

        .card-stats {
            position: absolute;
            top: 242px;
            left: 6px;
            right: 6px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            text-align: center;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .stat-val { font-size: 1.15rem; font-weight: 900; display: block; margin-top: 1px; }

        .card-badges {
            position: absolute;
            bottom: 12px;
            width: 100%;
            left: 0;
            display: flex;
            justify-content: center;
            gap: 18px;
            align-items: center;
            font-weight: 800;
            font-size: 0.85rem;
        }

        #leaderboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 35px;
            justify-items: center;
        }

        /* League Table Styles */
        .league-table-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        th {
            color: #aaa;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        td { font-weight: 700; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .pts-col { color: var(--gold); font-weight: 900; font-size: 1.1rem; }

        /* Match Calendar Grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }

        .match-date {
            font-size: 0.85rem;
            color: var(--gold);
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .match-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 800;
            background: #2c3e50;
        }

        .status-live { background: #e74c3c; animation: pulse 1.5s infinite; }
        .status-upcoming { background: #2980b9; }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--card-bg);
            color: #fff;
            margin: 4% auto;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header { font-size: 1.6rem; font-weight: 800; margin-bottom: 20px; text-align: center; color: var(--gold); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full-width { grid-column: span 2; }

        input, select {
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            box-sizing: border-box;
        }

        .save-btn {
            grid-column: span 2;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 1.8rem; cursor: pointer; color: #aaa; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1.05rem;
        }

        .playstyle-badge {
            background: var(--gold);
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            display: inline-block;
            margin: 3px;
        }

        .login-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>⚽ AYLESBURY LEAGUE</h1>
        <div>
            <button id="adminLoginBtn" class="admin-login-btn" onclick="openAdminModal()">Admin Login</button>
            <span id="adminBadge" class="admin-badge">⚡ Admin Active</span>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('cards')">Cards</button>
        <button class="tab-btn" onclick="switchTab('calendar')">Calendar</button>
        <button class="tab-btn" onclick="switchTab('table')">League Table</button>
    </div>

    <!-- TAB 1: CARDS -->
    <div id="cardsTab" class="tab-content active">
        <div class="controls-section">
            <button id="addPlayerBtn" class="open-modal-btn" onclick="openEditModal()">+ Add New Player</button>
            <div class="filter-group">
                <label>Filter Position:</label>
                <select id="posFilter" onchange="applyFilters()">
                    <option value="ALL">All Positions</option>
                    <option value="ATT">Attackers (ST, CF, RW, LW)</option>
                    <option value="MID">Midfielders (CM, CAM, CDM)</option>
                    <option value="DEF">Defenders (CB, LB, RB)</option>
                </select>

                <label>Sort By:</label>
                <select id="sortBy" onchange="applyFilters()">
                    <option value="ovr">Overall Rating</option>
                    <option value="goals">Most Goals</option>
                    <option value="assists">Most Assists</option>
                </select>
            </div>
        </div>
        <div id="leaderboard"></div>
    </div>

    <!-- TAB 2: CALENDAR -->
    <div id="calendarTab" class="tab-content">
        <div class="controls-section">
            <button id="addMatchBtn" class="open-modal-btn" onclick="openMatchModal()">+ Schedule Match</button>
        </div>
        <div id="matchesGrid" class="matches-grid"></div>
    </div>

    <!-- TAB 3: LEAGUE TABLE -->
    <div id="tableTab" class="tab-content">
        <div class="controls-section">
            <button id="addTeamBtn" class="open-modal-btn" onclick="openTeamModal()">+ Add Team</button>
        </div>
        <div class="league-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GD</th>
                        <th>PTS</th>
                        <th class="admin-only-col" style="display:none;">Action</th>
                    </tr>
                </thead>
                <tbody id="leagueTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Admin Login Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content" style="max-width:350px;">
        <span class="close-modal" onclick="closeAdminModal()">&times;</span>
        <div class="modal-header">Admin Login</div>
        <div class="form-grid" style="grid-template-columns: 1fr;">
            <input type="text" id="adminUser" placeholder="Username">
            <input type="password" id="adminPass" placeholder="Password">
            <button class="save-btn" onclick="loginAdmin()">Login</button>
            <div id="loginError" class="login-error">Invalid admin credentials</div>
        </div>
    </div>
</div>

<!-- Add/Edit Team Modal -->
<div id="teamModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeTeamModal()">&times;</span>
        <div class="modal-header" id="teamModalTitle">Add Team</div>
        <div class="form-grid">
            <input type="hidden" id="team-id">
            <input type="text" id="team-name" placeholder="Team Name" class="full-width">
            <input type="number" id="team-played" placeholder="Played (P)">
            <input type="number" id="team-wins" placeholder="Wins (W)">
            <input type="number" id="team-draws" placeholder="Draws (D)">
            <input type="number" id="team-losses" placeholder="Losses (L)">
            <input type="number" id="team-gd" placeholder="Goal Difference (GD)" class="full-width">
            <button class="save-btn" onclick="saveTeam()">Save Team Stats</button>
        </div>
    </div>
</div>

<!-- Add Match Modal -->
<div id="matchModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeMatchModal()">&times;</span>
        <div class="modal-header">Schedule Match</div>
        <div class="form-grid">
            <input type="text" id="match-home" placeholder="Home Team">
            <input type="text" id="match-away" placeholder="Away Team">
            <input type="date" id="match-date">
            <input type="time" id="match-time">
            <select id="match-status" class="full-width">
                <option value="Upcoming">Upcoming</option>
                <option value="Live">Live</option>
                <option value="Final">Final</option>
            </select>
            <button class="save-btn" onclick="saveMatch()">Save Match</button>
        </div>
    </div>
</div>

<!-- Player Details Modal -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeDetailModal()">&times;</span>
        <div class="modal-header" id="detailName">Player Details</div>
        <div id="detailBody"></div>
        <button class="save-btn" id="editFromDetailBtn" style="margin-top:20px; display:none;">Edit Player Stats</button>
    </div>
</div>

<!-- Add/Edit Player Modal -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-header" id="modalTitle">Add Player</div>
        <div class="form-grid">
            <input type="hidden" id="edit-id">
            <input type="text" id="name" placeholder="Full Name" class="full-width">
            <input type="text" id="img-url" placeholder="Transparent Cutout Photo URL" class="full-width">
            <input type="text" id="pos" placeholder="POS (ST, CM, CB)">
            <select id="wf">
                <option value="⭐">1★ Weak Foot</option>
                <option value="⭐⭐">2★ Weak Foot</option>
                <option value="⭐⭐⭐">3★ Weak Foot</option>
                <option value="⭐⭐⭐⭐" selected>4★ Weak Foot</option>
                <option value="⭐⭐⭐⭐⭐">5★ Weak Foot</option>
            </select>
            <select id="sm">
                <option value="1">1★ Skill Moves</option>
                <option value="2">2★ Skill Moves</option>
                <option value="3">3★ Skill Moves</option>
                <option value="4" selected>4★ Skill Moves</option>
                <option value="5">5★ Skill Moves</option>
            </select>
            <input type="number" id="pac" placeholder="PAC" max="99">
            <input type="number" id="sho" placeholder="SHO" max="99">
            <input type="number" id="pas" placeholder="PAS" max="99">
            <input type="number" id="dri" placeholder="DRI" max="99">
            <input type="number" id="def" placeholder="DEF" max="99">
            <input type="number" id="phy" placeholder="PHY" max="99">
            <input type="number" id="goals" placeholder="Goals Scored">
            <input type="number" id="assists" placeholder="Assists">
            <input type="text" id="playstyles" placeholder="PlayStyles (e.g. Finesse Shot)" class="full-width">
            <button class="save-btn" onclick="savePlayer()" id="saveBtnText">Save Player Data</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://bmwiqpkgdbeohkwbqaft.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kguMGdM9yIP_qoUdOU6x_w_4ObYO4Wt';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let rawPlayers = [];
    let displayedPlayers = [];
    let teamsList = [];
    let matchesList = [];
    let isAdmin = false;

    // Tab Navigation
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        if(tabName === 'cards') {
            document.getElementById('cardsTab').classList.add('active');
            event.target.classList.add('active');
        } else if(tabName === 'calendar') {
            document.getElementById('calendarTab').classList.add('active');
            event.target.classList.add('active');
            fetchMatches();
        } else if(tabName === 'table') {
            document.getElementById('tableTab').classList.add('active');
            event.target.classList.add('active');
            fetchTeams();
        }
    }

    /* Weighted OVR Calculation */
    function calculateWeightedOVR(pos, pac, sho, pas, dri, def, phy) {
        const position = (pos || '').toUpperCase();
        let ovr = 0;
        if (['ST', 'CF'].some(p => position.includes(p))) {
            ovr = (sho * 0.40) + (dri * 0.25) + (pac * 0.15) + (phy * 0.10) + (pas * 0.10);
        } else if (['RW', 'LW', 'RM', 'LM'].some(p => position.includes(p))) {
            ovr = (pac * 0.35) + (dri * 0.30) + (pas * 0.15) + (sho * 0.15) + (phy * 0.05);
        } else if (position.includes('CAM')) {
            ovr = (pas * 0.35) + (dri * 0.30) + (sho * 0.20) + (pac * 0.10) + (phy * 0.05);
        } else if (position.includes('CDM')) {
            ovr = (def * 0.35) + (phy * 0.25) + (pas * 0.20) + (dri * 0.10) + (pac * 0.10);
        } else if (position.includes('CM')) {
            ovr = (pas * 0.30) + (dri * 0.20) + (def * 0.15) + (phy * 0.15) + (sho * 0.10) + (pac * 0.10);
        } else if (['RB', 'LB', 'RWB', 'LWB'].some(p => position.includes(p))) {
            ovr = (pac * 0.30) + (def * 0.30) + (phy * 0.15) + (pas * 0.15) + (dri * 0.10);
        } else if (position.includes('CB')) {
            ovr = (def * 0.45) + (phy * 0.35) + (pac * 0.10) + (pas * 0.05) + (dri * 0.05);
        } else {
            ovr = (pac + sho + pas + dri + def + phy) / 6;
        }
        return Math.round(ovr);
    }

    async function fetchPlayers() {
        const { data } = await db.from('players_records').select('*');
        rawPlayers = data || [];
        applyFilters();
    }

    async function fetchTeams() {
        const { data } = await db.from('teams').select('*');
        teamsList = data || [];
        renderLeagueTable();
    }

    async function fetchMatches() {
        const { data } = await db.from('matches').select('*');
        matchesList = data || [];
        renderCalendar();
    }

    /* Admin Login */
    function openAdminModal() { document.getElementById('adminModal').style.display = 'block'; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

    async function loginAdmin() {
        const userInput = document.getElementById('adminUser').value.trim();
        const passInput = document.getElementById('adminPass').value.trim();
        const { data } = await db.from('admins').select('*').eq('username', userInput).eq('password', passInput);

        if (data && data.length > 0) {
            isAdmin = true;
            closeAdminModal();
            enableAdminUI();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function enableAdminUI() {
        document.getElementById('adminLoginBtn').style.display = 'none';
        document.getElementById('adminBadge').style.display = 'inline-block';
        document.querySelectorAll('.open-modal-btn').forEach(b => b.style.display = 'block');
        document.querySelectorAll('.admin-only-col').forEach(c => c.style.display = 'table-cell');
        renderLeaderboard();
        renderLeagueTable();
        renderCalendar();
    }

    /* League Table Logic */
    function renderLeagueTable() {
        const body = document.getElementById('leagueTableBody');
        body.innerHTML = '';

        // Calculate Points: (Wins * 3) + Draws
        teamsList.forEach(t => {
            t.pts = (t.wins * 3) + (t.draws * 1);
        });

        // Sort by Points descending, then Goal Difference
        teamsList.sort((a, b) => b.pts - a.pts || b.gd - a.gd);

        teamsList.forEach((t, i) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${i + 1}</td>
                <td>${t.name}</td>
                <td>${t.played || 0}</td>
                <td>${t.wins || 0}</td>
                <td>${t.draws || 0}</td>
                <td>${t.losses || 0}</td>
                <td>${t.gd || 0}</td>
                <td class="pts-col">${t.pts}</td>
                <td class="admin-only-col" style="display:${isAdmin ? 'table-cell' : 'none'};">
                    <button onclick="openTeamModal('${t.id}')" style="background:var(--gold); border:none; padding:4px 8px; border-radius:4px; font-weight:800; cursor:pointer;">Edit</button>
                    <button onclick="deleteTeam('${t.id}')" style="background:#e74c3c; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:800; cursor:pointer;">X</button>
                </td>
            `;
            body.appendChild(row);
        });
    }

    function openTeamModal(id = null) {
        if(!isAdmin) return;
        document.getElementById('team-id').value = '';
        document.getElementById('team-name').value = '';
        document.getElementById('team-played').value = '';
        document.getElementById('team-wins').value = '';
        document.getElementById('team-draws').value = '';
        document.getElementById('team-losses').value = '';
        document.getElementById('team-gd').value = '';

        if(id) {
            const t = teamsList.find(x => String(x.id) === String(id));
            if(t) {
                document.getElementById('team-id').value = t.id;
                document.getElementById('team-name').value = t.name;
                document.getElementById('team-played').value = t.played;
                document.getElementById('team-wins').value = t.wins;
                document.getElementById('team-draws').value = t.draws;
                document.getElementById('team-losses').value = t.losses;
                document.getElementById('team-gd').value = t.gd;
            }
        }
        document.getElementById('teamModal').style.display = 'block';
    }
    function closeTeamModal() { document.getElementById('teamModal').style.display = 'none'; }

    async function saveTeam() {
        const id = document.getElementById('team-id').value;
        const wins = parseInt(document.getElementById('team-wins').value) || 0;
        const draws = parseInt(document.getElementById('team-draws').value) || 0;

        const teamData = {
            name: document.getElementById('team-name').value,
            played: parseInt(document.getElementById('team-played').value) || 0,
            wins: wins,
            draws: draws,
            losses: parseInt(document.getElementById('team-losses').value) || 0,
            gd: parseInt(document.getElementById('team-gd').value) || 0,
            pts: (wins * 3) + draws
        };

        if(id) {
            await db.from('teams').update(teamData).eq('id', id);
        } else {
            await db.from('teams').insert([teamData]);
        }
        closeTeamModal();
        fetchTeams();
    }

    async function deleteTeam(id) {
        if(confirm("Delete team?")) {
            await db.from('teams').delete().eq('id', id);
            fetchTeams();
        }
    }

    /* Match Calendar Logic */
    function renderCalendar() {
        const grid = document.getElementById('matchesGrid');
        grid.innerHTML = '';

        matchesList.forEach(m => {
            const card = document.createElement('div');
            card.className = 'match-card';
            let statusClass = m.status === 'Live' ? 'status-live' : 'status-upcoming';

            card.innerHTML = `
                <div class="match-date">📅 ${m.match_date || 'TBD'} • ${m.match_time || ''}</div>
                <div class="match-teams">
                    <span>${m.home_team}</span>
                    <span style="color:var(--gold); font-size:0.8rem;">VS</span>
                    <span>${m.away_team}</span>
                </div>
                <span class="match-status ${statusClass}">${m.status || 'Upcoming'}</span>
                ${isAdmin ? `<button onclick="deleteMatch('${m.id}')" style="position:absolute; top:15px; right:15px; background:#e74c3c; color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer;">X</button>` : ''}
            `;
            grid.appendChild(card);
        });
    }

    function openMatchModal() { if(isAdmin) document.getElementById('matchModal').style.display = 'block'; }
    function closeMatchModal() { document.getElementById('matchModal').style.display = 'none'; }

    async function saveMatch() {
        const matchData = {
            home_team: document.getElementById('match-home').value,
            away_team: document.getElementById('match-away').value,
            match_date: document.getElementById('match-date').value,
            match_time: document.getElementById('match-time').value,
            status: document.getElementById('match-status').value
        };

        await db.from('matches').insert([matchData]);
        closeMatchModal();
        fetchMatches();
    }

    async function deleteMatch(id) {
        if(confirm("Delete match?")) {
            await db.from('matches').delete().eq('id', id);
            fetchMatches();
        }
    }

    /* Existing Player Cards & Filtering */
    function applyFilters() {
        const posFilter = document.getElementById('posFilter').value;
        const sortBy = document.getElementById('sortBy').value;

        displayedPlayers = rawPlayers.filter(p => {
            const pos = (p.pos || '').toUpperCase();
            if (posFilter === 'ATT') return ['ST', 'CF', 'RW', 'LW', 'RF', 'LF'].some(x => pos.includes(x));
            if (posFilter === 'MID') return ['CM', 'CAM', 'CDM', 'RM', 'LM'].some(x => pos.includes(x));
            if (posFilter === 'DEF') return ['CB', 'LB', 'RB', 'LWB', 'RWB', 'GK'].some(x => pos.includes(x));
            return true;
        });

        displayedPlayers.sort((a, b) => (b[sortBy] || 0) - (a[sortBy] || 0));
        renderLeaderboard();
    }

    function renderLeaderboard() {
        const container = document.getElementById('leaderboard');
        container.innerHTML = '';

        displayedPlayers.forEach((p) => {
            const ovrVal = p.ovr || 75;
            let tierClass = 'gold';
            if (ovrVal < 65) tierClass = 'bronze';
            else if (ovrVal < 75) tierClass = 'silver';

            const posText = p.pos || 'ST';
            const posFontSize = posText.length > 6 ? '0.65rem' : posText.length > 3 ? '0.8rem' : '1rem';

            const card = document.createElement('div');
            card.className = `fc-card ${tierClass}`;
            const imgSrc = (p.img && p.img !== 'EMPTY') ? p.img : 'https://cdn-icons-png.flaticon.com/512/1163/1163481.png';

            card.innerHTML = `
                <div class="fc-card-inner">
                    <button class="delete-btn" style="display: ${isAdmin ? 'block' : 'none'};" onclick="event.stopPropagation(); deletePlayer('${p.id}')">X</button>
                    <div class="card-top-left">
                        <div class="card-ovr">${ovrVal}</div>
                        <div class="card-pos" style="font-size: ${posFontSize};">${posText}</div>
                    </div>
                    <img src="${imgSrc}" class="card-player-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1163/1163481.png'">
                    <div class="card-name">${p.name}</div>
                    <div class="card-stats">
                        <div>PAC<span class="stat-val">${p.pac || 70}</span></div>
                        <div>SHO<span class="stat-val">${p.sho || 70}</span></div>
                        <div>PAS<span class="stat-val">${p.pas || 70}</span></div>
                        <div>DRI<span class="stat-val">${p.dri || 70}</span></div>
                        <div>DEF<span class="stat-val">${p.def || 70}</span></div>
                        <div>PHY<span class="stat-val">${p.phy || 70}</span></div>
                    </div>
                    <div class="card-badges">
                        <span>⚽ ${p.goals || 0}</span>
                        <span>🅰️ ${p.assists || 0}</span>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => openDetailModal(p));
            container.appendChild(card);
        });
    }

    function openDetailModal(p) {
        document.getElementById('detailName').innerText = p.name;
        const playstyleTags = (p.playstyles || 'None').split(',').map(ps => `<span class="playstyle-badge">${ps.trim()}</span>`).join('');

        document.getElementById('detailBody').innerHTML = `
            <div class="detail-row"><span>Position</span><strong>${p.pos}</strong></div>
            <div class="detail-row"><span>Overall Rating</span><strong>${p.ovr || 75} OVR</strong></div>
            <div class="detail-row"><span>Goals Scored</span><strong>⚽ ${p.goals || 0}</strong></div>
            <div class="detail-row"><span>Assists</span><strong>🅰️ ${p.assists || 0}</strong></div>
            <div class="detail-row"><span>Weak Foot</span><strong>${p.wf || '⭐⭐⭐⭐'}</strong></div>
            <div class="detail-row"><span>Skill Moves</span><strong>${'⭐'.repeat(p.sm || 4)}</strong></div>
            <div style="margin-top:15px;">
                <div style="margin-bottom:8px; font-weight:700;">PlayStyles:</div>
                <div>${playstyleTags}</div>
            </div>
        `;

        const editBtn = document.getElementById('editFromDetailBtn');
        editBtn.style.display = isAdmin ? 'block' : 'none';
        editBtn.onclick = () => { closeDetailModal(); openEditModal(p.id); };
        document.getElementById('detailModal').style.display = "block";
    }

    function closeDetailModal() { document.getElementById('detailModal').style.display = "none"; }

    function openEditModal(playerId = null) {
        if (!isAdmin) return;
        resetForm();
        if (playerId !== null) {
            const p = rawPlayers.find(x => String(x.id) === String(playerId));
            if (!p) return;
            document.getElementById('modalTitle').innerText = `Edit ${p.name}`;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('name').value = p.name;
            document.getElementById('img-url').value = (p.img && !p.img.includes('flaticon')) ? p.img : '';
            document.getElementById('pos').value = p.pos;
            document.getElementById('wf').value = p.wf || '⭐⭐⭐⭐';
            document.getElementById('sm').value = p.sm || 4;
            document.getElementById('pac').value = p.pac || 70;
            document.getElementById('sho').value = p.sho || 70;
            document.getElementById('pas').value = p.pas || 70;
            document.getElementById('dri').value = p.dri || 70;
            document.getElementById('def').value = p.def || 70;
            document.getElementById('phy').value = p.phy || 70;
            document.getElementById('goals').value = p.goals || 0;
            document.getElementById('assists').value = p.assists || 0;
            document.getElementById('playstyles').value = p.playstyles || '';
            document.getElementById('saveBtnText').innerText = "Update Player Info";
        }
        document.getElementById('playerModal').style.display = "block";
    }

    function closeModal() { document.getElementById('playerModal').style.display = "none"; }

    async function savePlayer() {
        if (!isAdmin) return;
        const posInput = document.getElementById('pos').value || "ST";
        const pac = parseInt(document.getElementById('pac').value) || 70;
        const sho = parseInt(document.getElementById('sho').value) || 70;
        const pas = parseInt(document.getElementById('pas').value) || 70;
        const dri = parseInt(document.getElementById('dri').value) || 70;
        const def = parseInt(document.getElementById('def').value) || 70;
        const phy = parseInt(document.getElementById('phy').value) || 70;

        const ovr = calculateWeightedOVR(posInput, pac, sho, pas, dri, def, phy);
        
        const playerData = {
            name: document.getElementById('name').value || "Player",
            img: document.getElementById('img-url').value || "https://cdn-icons-png.flaticon.com/512/1163/1163481.png",
            pos: posInput.toUpperCase(),
            wf: document.getElementById('wf').value,
            sm: parseInt(document.getElementById('sm').value) || 4,
            pac: pac, sho: sho, pas: pas, dri: dri, def: def, phy: phy,
            goals: parseInt(document.getElementById('goals').value) || 0,
            assists: parseInt(document.getElementById('assists').value) || 0,
            playstyles: document.getElementById('playstyles').value || 'Technical',
            ovr: ovr
        };

        const idInput = document.getElementById('edit-id').value;
        if (idInput) {
            await db.from('players_records').update(playerData).eq('id', idInput);
        } else {
            await db.from('players_records').insert([playerData]);
        }
        closeModal();
        fetchPlayers();
    }

    async function deletePlayer(playerId) {
        if (!isAdmin) return;
        if (confirm("Delete player?")) {
            await db.from('players_records').delete().eq('id', playerId);
            fetchPlayers();
        }
    }

    function resetForm() {
        document.getElementById('edit-id').value = '';
        document.getElementById('name').value = '';
        document.getElementById('img-url').value = '';
        document.getElementById('pos').value = '';
        document.getElementById('pac').value = '';
        document.getElementById('sho').value = '';
        document.getElementById('pas').value = '';
        document.getElementById('dri').value = '';
        document.getElementById('def').value = '';
        document.getElementById('phy').value = '';
        document.getElementById('goals').value = '';
        document.getElementById('assists').value = '';
        document.getElementById('playstyles').value = '';
        document.getElementById('wf').value = '⭐⭐⭐⭐';
        document.getElementById('sm').value = '4';
        document.getElementById('modalTitle').innerText = 'Add New Player';
        document.getElementById('saveBtnText').innerText = 'Add to League';
    }

    fetchPlayers();
</script>
</body>
</html>
